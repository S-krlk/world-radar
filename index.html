<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{background:#06111d;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
#map{position:fixed;inset:0}.ui{position:fixed;z-index:1000;inset:14px 14px auto;pointer-events:none}
.search{display:flex;gap:8px;background:#091827ee;border:1px solid #294052;border-radius:22px;padding:10px;box-shadow:0 8px 30px #0008;pointer-events:auto}
.search input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:white;font-size:17px;padding:8px}.btn{border:0;border-radius:15px;background:#122536;color:#fff;min-width:54px;font-size:20px}.btn.primary{background:#49aef1}
.panel{position:fixed;z-index:1000;left:14px;right:14px;bottom:18px;display:grid;gap:10px;pointer-events:none}.card{background:#081522eF;border:1px solid #294052;border-radius:24px;padding:16px;box-shadow:0 8px 35px #0009;pointer-events:auto}
.topcard{display:grid;grid-template-columns:1fr 1fr;gap:10px}.temp{font-size:48px;font-weight:800}.muted{color:#a9bac8}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.metric{background:#102232;border-radius:14px;padding:10px}.metric small{display:block;color:#8fa6b8}.metric b{font-size:16px}.storm{border-color:#6a3241}.timeline{display:flex;align-items:center;gap:10px}.timeline input{flex:1}
.tabs{position:fixed;z-index:1001;left:14px;bottom:190px;display:flex;flex-direction:column;gap:5px;background:#081522eF;padding:8px;border:1px solid #294052;border-radius:20px}.tab{border:0;background:transparent;color:white;font-size:25px;padding:8px}
.toast{position:fixed;z-index:2000;top:80px;left:50%;transform:translateX(-50%);background:#091827ee;padding:12px 18px;border-radius:14px;opacity:0;transition:.2s}.toast.show{opacity:1}
.leaflet-control-attribution{background:#081522cc!important;color:#b8c7d2!important}.leaflet-control-attribution a{color:#7dc9ff!important}
@media(max-width:700px){.topcard{grid-template-columns:1fr}.panel{bottom:12px}.tabs{bottom:220px}.metrics{grid-template-columns:repeat(3,1fr)}.metric{padding:8px}.metric b{font-size:14px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="ui"><form id="searchForm" class="search">
<input id="query" placeholder="Město, země…" autocomplete="off">
<button class="btn primary" aria-label="Hledat">⌕</button>
<button type="button" id="locate" class="btn">⊙</button>
<button type="button" id="refresh" class="btn">↻</button>
</form></div>
<div class="tabs">
<button class="tab active" data-layer="radar">🌧️</button>
<button class="tab" data-layer="sat">🛰️</button>
<button class="tab" data-layer="cloud">☁️</button>
<button class="tab" data-layer="lightning">⚡</button>
<button class="tab" data-layer="wind">💨</button>
</div>
<div class="panel">
<div class="topcard">
<section class="card">
<div class="muted">TEĎ · <b id="place">Olomouc</b></div>
<div><span id="temp" class="temp">--°</span> <span id="weatherIcon">☁️</span></div>
<div id="description" class="muted">Načítám…</div>
<div class="metrics">
<div class="metric"><small>💧 Vlhkost</small><b id="humidity">--</b></div>
<div class="metric"><small>💨 Vítr</small><b id="wind">--</b></div>
<div class="metric"><small>💨 Nárazy</small><b id="gust">--</b></div>
<div class="metric"><small>🧭 Směr</small><b id="direction">--</b></div>
<div class="metric"><small>🌧️ Srážky</small><b id="precip">--</b></div>
<div class="metric"><small>👁️ Viditelnost</small><b id="visibility">--</b></div>
</div>
</section>
<section class="card storm">
<div class="muted">⛈️ BOUŘKOVÝ ENGINE <b id="stormLevel">--</b></div>
<p id="stormText">Analyzuji CAPE, CIN, blesky a srážkový signál…</p>
<div class="metrics">
<div class="metric"><small>Bouřka</small><b id="stormScore">--</b></div>
<div class="metric"><small>CAPE</small><b id="cape">--</b></div>
<div class="metric"><small>Blesky</small><b id="lightningValue">--</b></div>
</div>
</section>
</div>
<section class="card"><div class="timeline"><b>RADAR TIMELINE</b><span id="radarTime" class="muted">--:--</span><button id="play" class="btn">▶</button></div><input id="radarSlider" type="range" min="0" max="0" value="0"><div id="radarStatus" class="muted">Načítám radar…</div></section>
<section class="card"><div class="muted">🔮 NOWCAST</div><p id="nowcastText">Načítám krátkodobý výhled…</p><small id="modelInfo" class="muted">--</small></section>
</div>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s);
const state={lat:49.5938,lon:17.2509,place:"Olomouc",frames:[],index:0,radar:null,opacity:.72,playing:false,timer:null,speed:1100,auto:true};

const map=L.map("map",{worldCopyJump:true,zoomAnimation:true,fadeAnimation:false,markerZoomAnimation:false,zoomSnap:.25,zoomDelta:.5}).setView([state.lat,state.lon],7);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
const satellite=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,opacity:.86,attribution:"Esri World Imagery"});
const marker=L.marker([state.lat,state.lon]).addTo(map);

const api=async url=>{const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()};
const notify=msg=>{const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove("show"),2200)};

function radarUrl(path){return `https://tilecache.rainviewer.com${path}/256/{z}/{x}/{y}/2/1_0.png`}
function renderRadar(){
 if(!state.frames.length)return;
 const frame=state.frames[state.index];
 if(state.radar)map.removeLayer(state.radar);
 state.radar=L.tileLayer(radarUrl(frame.path),{
   tileSize:256,minZoom:0,maxNativeZoom:7,maxZoom:19,opacity:state.opacity,
   updateWhenZooming:true,updateWhenIdle:true,keepBuffer:8,noWrap:false,zIndex:30,detectRetina:true,
   attribution:"Weather data by RainViewer"
 }).addTo(map);
 $("#radarTime").textContent=new Date(frame.time*1000).toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});
}
async function loadRadar(){
 try{
   const d=await api("https://api.rainviewer.com/public/weather-maps.json");
   state.frames=d.radar?.past||[];
   state.index=Math.max(0,state.frames.length-1);
   $("#radarSlider").max=Math.max(0,state.frames.length-1);
   $("#radarSlider").value=state.index;
   $("#radarStatus").textContent=`${state.frames.length} historických snímků`;
   renderRadar();
 }catch(e){$("#radarStatus").textContent="Radar se nepodařilo načíst";notify("Radar není momentálně dostupný")}
}
function weatherInfo(code){if(code>=95)return["⛈️","Bouřka"];if(code>=80)return["🌦️","Silné přeháňky"];if(code>=61)return["🌧️","Déšť"];if(code>=51)return["🌦️","Mrholení"];if(code>=45)return["🌫️","Mlha"];if(code>=3)return["☁️","Oblačno"];return["☀️","Jasno"]}
function windDir(deg){const dirs=["S","SV","V","JV","J","JZ","Z","SZ"];return dirs[Math.round(deg/45)%8]}
function value(x,unit=""){return x==null||Number.isNaN(Number(x))?"N/A":`${x}${unit}`}

async function loadWeather(){
 try{
   const base=`latitude=${state.lat}&longitude=${state.lon}&timezone=auto&forecast_days=2`;
   const u=`https://api.open-meteo.com/v1/forecast?${base}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,cape,convective_inhibition,lightning_density,thunderstorm_probability&models=ecmwf`;
   const d=await api(u),c=d.current,h=d.hourly||{};
   $("#place").textContent=state.place;
   $("#temp").textContent=value(Math.round(c.temperature_2m),"°");
   const [icon,desc]=weatherInfo(c.weather_code);
   $("#weatherIcon").textContent=icon;$("#description").textContent=desc;
   $("#humidity").textContent=value(Math.round(c.relative_humidity_2m),"%");
   $("#wind").textContent=value(Math.round(c.wind_speed_10m)," km/h");
   $("#gust").textContent=value(Math.round(c.wind_gusts_10m)," km/h");
   $("#direction").textContent=c.wind_direction_10m==null?"N/A":`${windDir(c.wind_direction_10m)} ${Math.round(c.wind_direction_10m)}°`;
   $("#precip").textContent=value(c.precipitation," mm");
   $("#visibility").textContent=c.visibility==null?"N/A":`${(c.visibility/1000).toFixed(1)} km`;

   const cape=h.cape?.[0],cin=h.convective_inhibition?.[0],ld=h.lightning_density?.[0],tp=h.thunderstorm_probability?.[0];
   $("#cape").textContent=value(cape==null?null:Math.round(cape)," J/kg");
   $("#lightningValue").textContent=value(ld==null?null:Number(ld).toFixed(2));
   $("#stormScore").textContent=value(tp==null?null:Math.round(tp),"%");
   $("#stormLevel").textContent=tp==null?"NEDOSTUPNÉ":tp>=65?"VYSOKÝ":tp>=35?"STŘEDNÍ":"NÍZKÝ";
   $("#stormText").textContent=tp==null?`Modelový bouřkový parametr není pro tuto lokalitu dostupný. CAPE ${value(cape," J/kg")} · CIN ${value(cin," J/kg")}.`:`Modelový bouřkový signál ${Math.round(tp)} %. CAPE ${value(cape," J/kg")} · CIN ${value(cin," J/kg")}.`;

   const p0=h.precipitation_probability?.[0]??0,p3=h.precipitation_probability?.[3]??0;
   $("#nowcastText").textContent=p0>=70?`Srážky jsou podle modelu velmi pravděpodobné už nyní (${Math.round(p0)} %). Radar sleduj pro skutečný pohyb srážek.`:p3>=60?`Srážky mohou zesílit během několika hodin. Model dává kolem +3 h pravděpodobnost ${Math.round(p3)} %.`:"V nejbližších hodinách není podle modelu výrazný srážkový signál.";
   $("#modelInfo").textContent=`ECMWF · Open-Meteo · ${new Date(d.current.time).toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"})} aktualizace`;
 }catch(e){
   console.error(e);notify("Počasí se nepodařilo načíst");
   $("#description").textContent="Data nejsou momentálně dostupná";
   $("#stormText").textContent="Bouřkový engine čeká na meteorologická data.";
 }
}

function setLayer(name){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.layer===name));
 if(name==="sat"){if(state.radar)map.removeLayer(state.radar);satellite.addTo(map);notify("Satelitní podklad")}
 else if(name==="radar"){if(map.hasLayer(satellite))map.removeLayer(satellite);if(!state.radar)renderRadar();else state.radar.addTo(map);notify("Radar zapnut")}
 else notify(name==="lightning"?"⚡ Blesky: modelová hustota":"Vrstva je dostupná v datovém panelu");
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setLayer(b.dataset.layer)));
$("#radarSlider").addEventListener("input",e=>{state.index=+e.target.value;renderRadar()});
$("#play").addEventListener("click",()=>{state.playing=!state.playing;$("#play").textContent=state.playing?"Ⅱ":"▶";clearInterval(state.timer);if(state.playing)state.timer=setInterval(()=>{if(!state.frames.length)return;state.index=(state.index+1)%state.frames.length;$("#radarSlider").value=state.index;renderRadar()},state.speed)});
$("#refresh").addEventListener("click",()=>{loadRadar();loadWeather()});
$("#locate").addEventListener("click",()=>{if(!navigator.geolocation)return notify("GPS není dostupné");navigator.geolocation.getCurrentPosition(p=>{state.lat=p.coords.latitude;state.lon=p.coords.longitude;state.place="Moje poloha";marker.setLatLng([state.lat,state.lon]);map.setView([state.lat,state.lon],9);loadWeather()},()=>notify("Poloha nebyla povolena")});
$("#searchForm").addEventListener("submit",async e=>{e.preventDefault();const q=$("#query").value.trim();if(!q)return;try{const a=await api("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q));if(!a[0])return notify("Místo nenalezeno");state.lat=+a[0].lat;state.lon=+a[0].lon;state.place=a[0].display_name.split(",")[0];marker.setLatLng([state.lat,state.lon]);map.setView([state.lat,state.lon],9);loadWeather()}catch(e){notify("Vyhledávání se nepodařilo")}});
loadRadar();loadWeather();setInterval(()=>{if(state.auto){loadRadar();loadWeather()}},10*60*1000);
</script>
</body>
</html>
